[project]
name = "llm-client"
version = "0.1.0"
description = "One small interface over OpenAI, Anthropic, Gemini, Ollama and OpenAI-compatible providers, with retry and an optional TTL cache."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Scaturchio" }]
keywords = ["llm", "openai", "anthropic", "claude", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cachetools>=5.3.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.10.0"]
anthropic = ["anthropic>=1.0.0"]
gemini = ["google-genai>=1.0.0"]
all = ["openai>=1.10.0", "anthropic>=1.0.0", "google-genai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/gr8monk3ys/llm-client"
Source = "https://github.com/gr8monk3ys/llm-client"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
